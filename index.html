<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RANDOM — The Oracle of Numbers</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <button class="btn-theme" id="themeBtn" onclick="toggleTheme()">🌙</button>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="container">
    <div class="header">
      <div class="header-label">Powered by chaos &amp; stardust</div>
      <div class="title">THE ORACLE</div>
      <div class="subtitle">Random Number Generator + Weird Life Facts</div>
    </div>

    <div class="range-row">
      <div class="range-group">
        <label>Minimum</label>
        <input type="number" id="minVal" value="1" />
      </div>
      <div class="range-divider">—</div>
      <div class="range-group">
        <label>Maximum</label>
        <input type="number" id="maxVal" value="100" />
      </div>
    </div>

    <div class="number-display" id="display">
      <div class="number-tag">Your number is</div>
      <span class="number-value" id="numberValue">?</span>
      <div class="number-corner" id="cornerCount">GEN #0</div>
      <button class="btn-copy" id="copyBtn" onclick="copyNumber()" style="display:none">📋<span class="copy-tooltip">Copied!</span></button>
    </div>

    <button class="btn-generate" id="generateBtn" onclick="generate()">
      ⚡ Generate Number
    </button>
    <button class="btn-roll3" id="roll3Btn" onclick="roll3()">🎲 Roll 3</button>

    <div class="fact-card" id="factCard">
      <div class="fact-label">✦ Weird Life Fact</div>
      <div class="fact-text" id="factText">Hit generate to receive a number and a strange truth about existence.</div>
    </div>

    <div class="history-strip" id="historyStrip"></div>
    <div class="counter">Generated <span id="genCount">0</span> numbers this session</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
