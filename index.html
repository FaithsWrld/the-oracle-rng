<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RANDOM — The Oracle of Numbers</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --accent: #e8ff47;
      --accent2: #ff4f7b;
      --text: #f0f0f0;
      --muted: #555570;
      --border: #2a2a3a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.4;
      animation: gridShift 20s linear infinite;
      z-index: 0;
    }

    @keyframes gridShift {
      0% { background-position: 0 0; }
      100% { background-position: 60px 60px; }
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.08;
      z-index: 0;
      animation: blobFloat 12s ease-in-out infinite alternate;
    }
    .blob-1 { width: 400px; height: 400px; background: var(--accent); top: -100px; left: -100px; animation-delay: 0s; }
    .blob-2 { width: 300px; height: 300px; background: var(--accent2); bottom: -80px; right: -80px; animation-delay: -5s; }
    .blob-3 { width: 200px; height: 200px; background: #4f7bff; top: 50%; left: 50%; animation-delay: -3s; }

    @keyframes blobFloat {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 40px) scale(1.1); }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .header { text-align: center; }

    .header-label {
      font-size: 0.65rem;
      letter-spacing: 0.4em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.5rem, 10vw, 6rem);
      letter-spacing: 0.05em;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent) 0%, #fff 60%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      color: var(--muted);
      margin-top: 0.4rem;
    }

    .range-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      width: 100%;
    }

    .range-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .range-group label {
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .range-group input[type="number"] {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 1.1rem;
      padding: 0.7rem 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .range-group input[type="number"]:focus {
      border-color: var(--accent);
    }

    .range-divider {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      color: var(--muted);
      margin-top: 1.2rem;
    }

    .number-display {
      position: relative;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3rem 2rem;
      text-align: center;
      overflow: hidden;
      cursor: default;
      transition: border-color 0.3s;
    }

    .number-display::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 40%, rgba(232,255,71,0.03) 100%);
    }

    .number-display.flash {
      border-color: var(--accent);
      animation: flashBorder 0.4s ease-out;
    }

    @keyframes flashBorder {
      0% { box-shadow: 0 0 0 0 rgba(232,255,71,0.5); }
      100% { box-shadow: 0 0 30px 4px rgba(232,255,71,0); }
    }

    .number-tag {
      font-size: 0.55rem;
      letter-spacing: 0.4em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 0.8rem;
    }

    .number-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(5rem, 18vw, 10rem);
      line-height: 1;
      color: var(--accent);
      transition: opacity 0.1s;
      min-height: 1em;
      display: block;
      text-shadow: 0 0 60px rgba(232,255,71,0.3);
    }

    .number-value.rolling {
      animation: rollNumber 0.5s ease-out;
    }

    @keyframes rollNumber {
      0%   { transform: translateY(-20px) scale(1.05); opacity: 0; }
      60%  { transform: translateY(4px) scale(0.98); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    .number-corner {
      position: absolute;
      top: 0.8rem; right: 0.8rem;
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      color: var(--muted);
    }

    .btn-generate {
      width: 100%;
      background: var(--accent);
      color: #0a0a0f;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 0.15em;
      border: none;
      padding: 1.1rem 2rem;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.1s, box-shadow 0.2s;
    }

    .btn-generate::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.15);
      transform: translateX(-100%);
      transition: transform 0.3s ease;
    }

    .btn-generate:hover::after { transform: translateX(0); }
    .btn-generate:hover { box-shadow: 0 0 40px rgba(232,255,71,0.4); }
    .btn-generate:active { transform: scale(0.98); }

    .fact-card {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 1.5rem;
      position: relative;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .fact-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .fact-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: linear-gradient(to bottom, var(--accent), var(--accent2));
    }

    .fact-label {
      font-size: 0.55rem;
      letter-spacing: 0.35em;
      color: var(--accent2);
      text-transform: uppercase;
    }

    .fact-text {
      font-size: 0.85rem;
      line-height: 1.7;
      color: #c8c8d8;
      font-style: italic;
    }

    .fact-text.loading::after {
      content: '...';
      animation: dots 1s steps(3, end) infinite;
    }

    @keyframes dots {
      0%, 100% { content: '.'; }
      33% { content: '..'; }
      66% { content: '...'; }
    }

    .history-strip {
      width: 100%;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
      min-height: 28px;
    }

    .history-pill {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.2rem 0.6rem;
      animation: pillIn 0.3s ease-out;
    }

    @keyframes pillIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    .history-pill:last-child {
      color: var(--text);
      border-color: var(--muted);
    }

    .counter {
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      color: var(--muted);
      padding-bottom: 2rem;
    }

    .counter span { color: var(--accent); }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="container">
    <div class="header">
      <div class="header-label">Powered by chaos &amp; stardust</div>
      <div class="title">THE ORACLE</div>
      <div class="subtitle">Random Number Generator + Weird Life Facts</div>
    </div>

    <div class="range-row">
      <div class="range-group">
        <label>Minimum</label>
        <input type="number" id="minVal" value="1" />
      </div>
      <div class="range-divider">—</div>
      <div class="range-group">
        <label>Maximum</label>
        <input type="number" id="maxVal" value="100" />
      </div>
    </div>

    <div class="number-display" id="display">
      <div class="number-tag">Your number is</div>
      <span class="number-value" id="numberValue">?</span>
      <div class="number-corner" id="cornerCount">GEN #0</div>
    </div>

    <button class="btn-generate" id="generateBtn" onclick="generate()">
      ⚡ Generate Number
    </button>

    <div class="fact-card" id="factCard">
      <div class="fact-label">✦ Weird Life Fact</div>
      <div class="fact-text" id="factText">Hit generate to receive a number and a strange truth about existence.</div>
    </div>

    <div class="history-strip" id="historyStrip"></div>
    <div class="counter">Generated <span id="genCount">0</span> numbers this session</div>
  </div>

  <script>
    const facts = [
      "Cleopatra lived closer in time to the Moon landing than to the construction of the Great Pyramid.",
      "There are more possible iterations of a game of chess than there are atoms in the observable universe.",
      "A day on Venus is longer than a year on Venus.",
      "Honey found in ancient Egyptian tombs is still perfectly edible after 3,000 years.",
      "The human body contains enough iron to make a nail about 3 inches long.",
      "Sharks are older than trees — they've existed for over 450 million years.",
      "All the ants on Earth weigh more than all the humans combined.",
      "A group of flamingos is called a 'flamboyance.'",
      "You share 50% of your DNA with a banana.",
      "Oxford University is older than the Aztec Empire.",
      "The inventor of the Pringles can is buried in one.",
      "Crows can recognize human faces and hold grudges for years.",
      "The average person walks enough in a lifetime to circle the Earth five times.",
      "Octopuses have three hearts, blue blood, and their arms have a mind of their own.",
      "There's a planet made almost entirely of diamond, twice the size of Earth.",
      "Humans share 60% of their DNA with a fruit fly.",
      "A bolt of lightning contains enough energy to toast about 100,000 slices of bread.",
      "The shortest war in history lasted 38 to 45 minutes.",
      "Butterflies taste with their feet.",
      "Every atom in your body is billions of years old and was forged inside a dying star.",
      "The total weight of all bacteria on Earth outweighs all animals combined.",
      "A single cloud can weigh over a million pounds.",
      "Your body replaces most of its cells every 7-10 years. You are mostly not who you were.",
      "There are more trees on Earth than stars in the Milky Way.",
      "Wombats produce cube-shaped droppings — the only animal known to do so.",
      "Tardigrades can survive in the vacuum of space, radiation, and boiling water.",
      "The Eiffel Tower grows about 6 inches taller in summer due to heat expansion.",
      "A photon of light takes about 100,000 years to travel from the Sun's core to its surface, then just 8 minutes to reach Earth.",
      "The smell of rain has a name: petrichor. It comes from bacteria in the soil.",
      "A strawberry is not technically a berry, but a banana is.",
    ];

    let count = 0;
    let history = [];

    async function generate() {
      const min = parseInt(document.getElementById('minVal').value);
      const max = parseInt(document.getElementById('maxVal').value);
      if (isNaN(min) || isNaN(max) || min >= max) {
        alert('Please enter a valid range (min must be less than max).');
        return;
      }

      const num = Math.floor(Math.random() * (max - min + 1)) + min;
      count++;

      const numEl = document.getElementById('numberValue');
      const display = document.getElementById('display');
      numEl.classList.remove('rolling');
      void numEl.offsetWidth;
      numEl.textContent = num;
      numEl.classList.add('rolling');
      display.classList.remove('flash');
      void display.offsetWidth;
      display.classList.add('flash');
      document.getElementById('cornerCount').textContent = `GEN #${count}`;
      document.getElementById('genCount').textContent = count;

      history.unshift(num);
      if (history.length > 8) history.pop();
      const strip = document.getElementById('historyStrip');
      strip.innerHTML = history.map((n, i) =>
        `<div class="history-pill" style="opacity:${1 - i * 0.1}">${n}</div>`
      ).join('');

      const factCard = document.getElementById('factCard');
      const factText = document.getElementById('factText');
      factCard.classList.remove('visible');
      factText.classList.add('loading');
      factText.textContent = 'Consulting the universe';

      await new Promise(r => setTimeout(r, 600));

      try {
        const response = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: "claude-sonnet-4-20250514",
            max_tokens: 1000,
            system: "You are a source of the most bizarre, mind-bending, verified facts about life, the universe, science, history, and nature. Return ONLY a single fact as plain text — no quotes, no preamble, no label. Make it weird, surprising, and true. Vary widely: biology, physics, history, geology, animals, time, space. Never repeat yourself.",
            messages: [{ role: "user", content: `Give me one weird fact. The random number generated was ${num}. Use it as a seed for the category.` }]
          })
        });
        const data = await response.json();
        const aiFactText = data.content?.[0]?.text?.trim();
        if (aiFactText) {
          factText.classList.remove('loading');
          factText.textContent = aiFactText;
        } else {
          throw new Error('no content');
        }
      } catch (e) {
        const fact = facts[Math.floor(Math.random() * facts.length)];
        factText.classList.remove('loading');
        factText.textContent = fact;
      }

      factCard.classList.add('visible');
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') generate();
    });
  </script>
</body>
</html>
